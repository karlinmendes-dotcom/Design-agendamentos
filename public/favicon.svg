<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A5A4B"/>
      <stop offset="1" stop-color="#22382E"/>
    </linearGradient>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D5A8"/>
      <stop offset="0.55" stop-color="#C9A86A"/>
      <stop offset="1" stop-color="#D9BE8A"/>
    </linearGradient>
  </defs>
  <!-- Fundo quadrado verde profundo -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <!-- Aro fino champanhe -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12.5" fill="none" stroke="#C9A86A" stroke-opacity="0.55" stroke-width="1.4"/>
  <!-- Monograma NB em serifa, dourado champanhe -->
  <text x="32" y="41.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="url(#nb)" letter-spacing="-0.5">NB</text>
  <!-- Pequena coroa/brilho acima do monograma -->
  <path d="M27.5 22.5 L29.5 20.5 L32 22.5 L34.5 20.5 L36.5 22.5 Z" fill="none" stroke="#C9A86A" stroke-opacity="0.8" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="32" cy="25.5" r="1.1" fill="#D9BE8A"/>
</svg>
